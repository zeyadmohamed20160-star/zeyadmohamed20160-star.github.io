<!-- Main Login Form Container -->
<div class="login-container" style="max-width: 500px; margin: 0 auto; padding: 20px; background: #13111c; border-radius: 12px; border: 1px solid #251f38;">
    <form id="appleLoginForm">
        
        <!-- Apple ID Field -->
        <div class="input-group" style="margin-bottom: 15px; text-align: left;">
            <label for="appleId" style="display: block; color: #a855f7; font-size: 14px; margin-bottom: 5px; font-weight: 500;">Apple ID</label>
            <input type="email" id="appleId" name="appleId" value="zeyadmohamed20160@gmail.com" required
                   style="width: 100%; padding: 12px; background: #09070f; color: #ffffff; border: 1px solid #3b2d54; border-radius: 8px; font-size: 15px; outline: none; box-sizing: border-box;">
        </div>

        <!-- Password Field -->
        <div class="input-group" style="margin-bottom: 20px; text-align: left;">
            <label for="applePassword" style="display: block; color: #a855f7; font-size: 14px; margin-bottom: 5px; font-weight: 500;">Apple ID Password</label>
            <input type="password" id="applePassword" name="applePassword" placeholder="Enter your password" required
                   style="width: 100%; padding: 12px; background: #09070f; color: #ffffff; border: 1px solid #3b2d54; border-radius: 8px; font-size: 15px; outline: none; box-sizing: border-box;">
        </div>

        <!-- Action Button -->
        <button type="submit" id="submitBtn" 
                style="width: 100%; padding: 14px; background: #a855f7; color: #ffffff; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s;">
            Generate Signing Files (.p12 & .mobileprovision)
        </button>
    </form>

    <!-- Real-time Status Box -->
    <div id="statusReport" style="margin-top: 15px; color: #b794f4; font-size: 14px; min-height: 20px;"></div>
</div>

<script>
// Change this string variable to your actual hosted backend domain url (e.g., https://render.com)
const CLOUD_BACKEND_URL = "https://YOUR-LIVE-BACKEND-URL.com";

document.getElementById('appleLoginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const statusBox = document.getElementById('statusReport');
    const submitButton = document.getElementById('submitBtn');
    
    const emailValue = document.getElementById('appleId').value;
    const passwordValue = document.getElementById('applePassword').value;
    
    // UI Feedback Loop
    statusBox.style.color = "#b794f4";
    statusBox.innerText = "Contacting cloud engine and authenticating profiles...";
    submitButton.disabled = true;
    submitButton.style.background = "#5b21b6";

    try {
        const response = await fetch(`${CLOUD_BACKEND_URL}/generate`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: emailValue, password: passwordValue })
        });
        
        const metadata = await response.json();
        
        if (response.ok) {
            statusBox.style.color = "#4ade80";
            statusBox.innerHTML = "<span>Files generated! Initiating download loop...</span>";
            
            // Triggers native iOS profile download popups sequentially inside Safari
            window.open(`${CLOUD_BACKEND_URL}${metadata.download_p12}`, '_blank');
            setTimeout(() => {
                window.open(`${CLOUD_BACKEND_URL}${metadata.download_provision}`, '_blank');
            }, 1000);
        } else {
            statusBox.style.color = "#f87171";
            statusBox.innerText = "Compilation Error: " + metadata.message;
        }
    } catch (err) {
        statusBox.style.color = "#f87171";
        statusBox.innerText = "Network Error: Could not establish a connection to your cloud engine.";
    } finally {
        submitButton.disabled = false;
        submitButton.style.background = "#a855f7";
    }
});
</script>
