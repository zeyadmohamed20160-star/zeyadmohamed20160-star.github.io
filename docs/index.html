<!-- Replace your current input boxes with this clean form template -->
<form id="loginForm">
    <input type="email" id="appleId" placeholder="Apple ID Email" required 
           style="width: 100%; padding: 10px; margin-bottom: 10px; background: #1a1a1a; color: white; border: 1px solid #333; border-radius: 5px;">
    
    <input type="password" id="applePassword" placeholder="Apple ID Password" required 
           style="width: 100%; padding: 10px; margin-bottom: 15px; background: #1a1a1a; color: white; border: 1px solid #333; border-radius: 5px;">
    
    <button type="submit" style="width: 100%; padding: 12px; background: #a855f7; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer;">
        Generate Signing Files (.p12 & .mobileprovision)
    </button>
</form>

<div id="statusMessage" style="margin-top: 15px; color: #a855f7; text-align: center;"></div>

<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const status = document.getElementById('statusMessage');
    status.innerText = "Connecting to Anisette Gateway and contacting Apple...";
    
    const email = document.getElementById('appleId').value;
    const password = document.getElementById('applePassword').value;
    
    try {
        // Sends the inputs straight to your local backend server
        const response = await fetch('http://127.0.0', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email, password: password })
        });
        
        if (response.ok) {
            status.innerText = "Success! Your signing files are compiling for download.";
            // Triggers a file download in the browser
            window.location.href = 'http://127.0.0';
        } else {
            const errData = await response.json();
            status.innerText = "Error: " + errData.message;
        }
    } catch (err) {
        status.innerText = "Failed to connect to backend engine.";
    }
});
</script>
